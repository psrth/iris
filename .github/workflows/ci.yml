name: ci
on:
  pull_request:
    paths: ["**.go", "go.mod", "go.sum", "build-tags.txt", ".github/workflows/ci.yml"]
  push:
    branches: [main]
    paths: ["**.go", "go.mod", "go.sum", "build-tags.txt", ".github/workflows/ci.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
